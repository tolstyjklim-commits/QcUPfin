name: Deploy QcUp to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Settings -> Secrets and variables -> Actions -> Variables
          VITE_TON_ADDRESS: ${{ vars.VITE_TON_ADDRESS }}
          VITE_TONCENTER_KEY: ${{ vars.VITE_TONCENTER_KEY }}
          VITE_COINS_PER_TON: ${{ vars.VITE_COINS_PER_TON }}
          VITE_COINS_PER_USDT: ${{ vars.VITE_COINS_PER_USDT }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
