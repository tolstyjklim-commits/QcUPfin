# Запуск на VPS: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD}
      POSTGRES_DB: qcup
    volumes:
      - qcup_pgdata:/var/lib/postgresql/data
  api:
    build: ../backend
    restart: unless-stopped
    depends_on: [db]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://qcup:${DB_PASSWORD}@db:5432/qcup?schema=public
      API_PORT: "4000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?задайте API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  qcup_pgdata:
  caddy_data:
